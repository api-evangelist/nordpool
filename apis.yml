apis:
- aid: nordpool:nordpool-intraday-trading-api
  name: Nord Pool Intraday Trading API
  tags:
  - Intraday Trading
  - WebSocket
  - STOMP
  - Order Entry
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.nordpoolgroup.com/v1.0/docs/id-introduction
  baseURL: https://www.nordpoolgroup.com/en/trading/api/
  properties:
  - url: https://developers.nordpoolgroup.com/v1.0/docs/id-introduction
    type: Documentation
  - url: https://github.com/NordPool/public-intraday-api
    type: GitHubRepository
  - url: https://github.com/NordPool/public-intraday-api-example
    type: GitHubRepository
  - url: asyncapi/nordpool-intraday-asyncapi.yml
    type: AsyncAPI
  description: >-
    WebSocket API for continuous intraday power trading - clients speak STOMP over secure WebSocket (port
    443) to parallel Market Data and Trading services for streaming contracts, order books, and capacities,
    and for order entry and private execution reports. A newer binary PMD v2 feed uses Protocol Buffers
    over WebSockets. Free to use but only for onboarded Nord Pool trading customers; channel names in
    the AsyncAPI are modeled from public GitHub examples.
- aid: nordpool:nordpool-auction-trading-api
  name: Nord Pool Auction API
  tags:
  - Day-Ahead Trading
  - Auctions
  - Order Entry
  - Trade Capture
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.nordpoolgroup.com/en/trading/api/
  baseURL: https://www.nordpoolgroup.com/en/trading/api/
  properties:
  - url: https://support.nordpoolgroup.com/support/solutions/articles/8000088508-faq-auction-api
    type: Documentation
  - url: https://github.com/NordPool/AuctionApi-StarterKit
    type: GitHubRepository
  description: >-
    JSON REST API for day-ahead auction trading - integrated order submission and trade capture across
    the Nordic and Baltic auctions, CWE auctions, Poland, the GB Half Hourly Auction, and SEM-GB intraday
    auctions, with test systems available. Free to use but restricted to Nord Pool trading members; endpoints
    are not publicly documented, so no OpenAPI is modeled here.
