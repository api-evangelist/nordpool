        required: true
        schema:
          minItems: 1
          type: string
          items:
            type: string
      - name: deliveryStartFrom
        in: query
        description: Earliest delivery start time, referring to a UTC hour. Contracts with delivery start at this hour or later will be included in the response. Format yyyy-MM-ddThh:mm:ssZ, for example 2024-08-15T01:00:00Z
        required: true
        schema:
          type: string
          format: date-time
      - name: deliveryStartTo
        in: query
        description: Latest delivery start time, referring to a UTC hour. Contracts with delivery start earlier than this hour will be included in the response. Format yyyy-MM-ddThh:mm:ssZ, for example 2024-08-15T02:00:00Z
        required: true
        schema:
          type: string
          format: date-time
