  /api/v2/Intraday/OrderBook/ByContractId:
    get:
      tags:
      - Intraday
      summary: Intraday Order Book By Contract
      description: "Returns all intraday order book changes for the given contract and area, where the contract delivery start is within the given UTC date.\nThis data corresponds to the local view data type in the Intraday system.\n            \nOrder book data becomes available with a delay of 2–3 hours after the contract is closed. It contains event messages called revisions that come from XBID\nand/or NPM (Nord Pool Matcher). Each revision represents either:\n- A **delta** (\"isSnapshot\": false) that contains only the newly added or updated order information compared to previous revisions.\nFor example, if previous revision contains orders I1, I2, and I3, and new orders I4 and I5 are added, the delta revision will only contain I4 and I5.\n \n- A **snapshot** (\"isSnapshot\": true) that provides the full set of actual orders for the contract at current moment(e.g., I1 to I5).\nSnapshots may occur between delta revisions, for instance, when the connection to XBID is temporarily lost.\nIn such cases, previous revisions must be overwritten with the snapshot's data. Although rare, this scenario is possible.\n            \nRevisions are sequential but might be empty or occasionally duplicated.\n            \nEach non-empty revision consists of the buy and/or sell orders for the specified area. The order details include \norder id, price, volume, deleted flag, updated time and priority time. If an order is removed, the associated data will include \"deleted\": true and volume = 0.\n            \n### Execution priority\nThe priority timestamp determines the execution priority for orders with the same price.\nExecution of orders is based on the price-time-priority principle:\n- **Price** \n\n  Orders are always executed at the best price. The best buy order is always executed against the best sell order\nfirst (the best price for buy orders is the highest price, for sell orders its the lowest price). \n- **Time** \n\n  When an order is entered into the order book, it is assigned a timestamp. This timestamp is used to prioritize\norders with the same price. Orders with earlier timestamps are executed with a higher priority than orders with a later timestamp.\n\n### Response field descriptions\n            \n- **contractId**: identifier of the contract to which these orders belong\n- **deliveryArea**: delivery area that this order belongs to. Note: in XBID, the delivery area does not reflect the order's origin\n- **status**: \"Missing\" if data does not exist and \"Available\" if data exists\n- **revision**: version of the order book revision per contract\n- **isSnapshot**: if false: the revision contains only delta information with changes from previous revisions. If true: the revision contains\n a complete snapshot of the orders at the current state. Previous data must be overwritten.\n- **orderId**: order identifier, where the first character represents the market: I for Nord Pool Intraday or X for XBID.\nThe remaining part is a rolling unique number for the order (unique per market)\n- **price**: unit price\n- **priceUnit**: defines the unit for all prices. Given as either EUR/MWh, GBP/MWh or ISK/MWh\n- **volume**: visible quantity on the current delivery area\n- **deleted**: if false: update information with the contents received. If true: delete entity indicated in the revision\n- **priorityTime**: timestamp is used to prioritize orders with the same price\n- **updatedTime**: timestamp at which this order was updated, either due to an action by the user (e.g. modification)\nor by the system (e.g. validity expired, contract expired)\n            \n[Sample response with valid data for area NO1, delivery date UTC 2025-05-05 and contract id NX_519789](https://proddataservicespublic.blob.core.windows.net/public-api-response-samples/Intraday/get_api_v2_Intraday_OrderBook_ByContractId.json)"
      parameters:
      - name: area
        in: query
        description: 'Delivery area (e.g., NO1).

          Supported: NO1,NO2,NO3,NO4,NO5,SE1,SE2,SE3,SE4,FI,DK1,DK2,EE,LT,LV,AT,BE,FR,50Hz,AMP,TTG,TBW,NL,PL,TEL,BG,UK,IS'
        required: true
        schema:
          minLength: 1
          type: string
      - name: deliveryDateUtc
        in: query
        description: Delivery date of the contract, referring to UTC date. Format yyyy-MM-dd, for example 2025-03-20
        required: true
        schema:
          type: string
          format: date
      - name: contractId
        in: query
        description: The contract id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiOrderbook'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiOrderbook'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiOrderbook'
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
  /api/v2/Intraday/OrderBook/ContractsIds/ByArea:
    get:
      tags:
