openapi: 3.2.0
info:
  title: Nord Pool Market Data Intraday API
  description: 'Nord Pool''s Market Data API (v2) provides programmatic access to European power exchange market data: day-ahead auction prices, price indices, volumes, capacities, flows and aggregated bid curves; intraday continuous statistics, orders, trades and order books; balance market (mFRR) data; power system data (production, consumption, forecasts, hydro reservoir reserves); system price and turnover; and exchange rates.'
  version: v2
  contact:
    name: Nord Pool Power Data Services
    url: https://www.nordpoolgroup.com/en/services/power-market-data-services/
servers:
- url: https://data-api.nordpoolgroup.com
  description: Nord Pool Market Data API (production)
security:
- oauth2: []
tags:
- name: Intraday
paths:
  /api/v2/Intraday/ContractStatistics/ByAreas:
    get:
      tags:
      - Intraday
      summary: Intraday Contract Statistics
      description: 'Returns intraday contract statistics for a date and a list of areas.


        All intraday trades where at least one leg (buy or/and sell) belongs to Nord Pool, Independent Bulgarian Energy Exchange (IBEX), Bursa Română de Mărfuri S.A (BRM) or Elma Orkuviðskipti (ELMA) and one leg belongs to queried area are included in the calculation of contract statistics. However, trades where both legs belong to other PXs are excluded from the statistics.

        The calculation includes local and SIDC trades, as well as block trades and wash trades (trades where the same legal entity is on both the buy and sell sides).


        Intraday contract statistics are updated every 15 minutes for open contracts spanning today, tomorrow, and day after tomorrow.


        ### Response field descriptions

        - **status**: Missing if no data found for the date and area. Available if data is present

        - **priceUnit**: defines the unit for all prices. Given as either EUR/MWh, GBP/MWh or ISK/MWh

        - **contracts**: a list of contracts for this delivery day

        - **deliveryStart**: delivery start time for the contract

        - **deliveryEnd**: delivery end time for the contract

        - **isLocalContract**: false if the contract is provided by XBID / SIDC, true if this contract is provided outside XBID / SIDC

        - **contractId**: the id of the contract

        - **contractName**: the name of the contract

        - **contractOpenTime**: the time the contract opens for trading

        - **contractCloseTime**: the time the contract closes for trading

        - **highPrice**: the highest trade price observed in the contract and area

        - **lowPrice**: the lowest trade price observed in the contract and area

        - **openPrice**: the price of the first trade in the contract and area

        - **openTradeTime**: the timestamp of the first trade in the area

        - **closePrice**: the price of the last observed trade in the contract and area. Note that if the contract is still open, this might change

        - **closeTradeTime**: the timestamp of the last observed trade in the area

        - **averagePrice**: the volume weighted average price for all trades observed in the contract and area

        - **volume**: the transaction volume of the contract and area given in MW

        - **buyVolume**: total buy volume in the area across all transactions given in MW

        - **sellVolume**: total sell volume in the area across all transactions given in MW

        - **averagePriceLast3H**: volume weighted average price for all trades happening within 3 hours of contract closing

        - **averagePriceLast1H**: volume weighted average price for all trades happening within 1 hour of contact closing


        For a detailed breakdown on calculation rules, see this page.


        Sample response with valid data for areas NO1,AMP and date 2025-05-05'
      externalDocs:
        description: Data portal link
        url: https://data.nordpoolgroup.com/intraday/intraday-market-statistics?deliveryDate=latest&deliveryArea=50Hz
      parameters:
      - name: areas
        in: query
        description: 'Comma-separated list of areas (e.g., NO1, NO2).

          Supported: KT(legacy),NO1,NO2,NO3,NO4,NO5,SE1,SE2,SE3,SE4,FI,DK1,DK2,EE,LT,LV,AT,BE,FR,GER,50Hz,AMP,TTG,TBW,NL,PL,TEL,BG,UK,IS'
        required: true
        schema:
          minItems: 1
          type: string
          items:
            type: string
      - name: date
        in: query
        description: Delivery date, referring to CET date. Format yyyy-MM-dd, for example 2024-08-15
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiDeliveryAreaMarketStatistic'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiDeliveryAreaMarketStatistic'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiDeliveryAreaMarketStatistic'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
      operationId: getApiV2IntradayContractStatisticsByAreas
      x-operation-id-source: derived
