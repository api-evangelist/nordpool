          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiTotalMarketYearlyStatistic'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTotalMarketYearlyStatistic'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiTotalMarketYearlyStatistic'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
