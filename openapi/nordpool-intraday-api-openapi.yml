      summary: Intraday Yearly Hourly Total Statistics
      description: " Returns total intraday hourly statistics for a year.\n            \nThis aggregate is updated once per day, and includes data up until yesterday (CET).\n\n Intraday hourly statistics provide a comprehensive overview of all trading activity for a specific delivery hour across all areas. These statistics are derived from the trade data available for the selected delivery hour.\n            \nAll intraday trades where at least one leg (buy or/and sell) belongs to Nord Pool, Independent Bulgarian Energy Exchange (IBEX) or Bursa Română de Mărfuri S.A (BRM) in trading currency EUR are included in the calculation of hourly statistics. However, trades where both legs belong to other PXs are excluded from the statistics. The calculation includes local and SIDC trades, as well as block trades and wash trades (trades where the same legal entity is on both the buy and sell sides). \n            \n            \n### Response field descriptions\n- **status**: Missing if no data found for the year. Available if data is present\n- **priceUnit**: defines the unit for all prices. For contract total statistics, this is always EUR/MWh\n- **hourlyStatistics**: a list of delivery hours for this year\n  - **deliveryStart**: delivery start time \n  - **deliveryEnd**: delivery end time \n  - **highPrice**: the highest trade price observed in the delivery hour\n  - **lowPrice**: the lowest trade price observed in the delivery hour\n  - **openPrice**: the price of the first trade in the delivery hour\n  - **openTradeTime**: the timestamp of the first trade in the delivery hour\n  - **closePrice**: the price of the last observed trade in the delivery hour. Note that if the trading is still ongoing, this might change\n  - **closeTradeTime**: the timestamp of the last observed trade in the delivery hour\n  - **averagePrice**: the volume weighted average price for all trades observed in the delivery hour\n  - **volume**: the transaction volume of the delivery hour given in MWh\n  - **buyVolume**: total buy volume in the delivery hour across all transactions given in MWh\n  - **sellVolume**: total sell volume in the delivery hour across all transactions given in MWh\n  - **averagePriceLast3H**: volume weighted average price for all trades happening within 3 hours before delivery start\n  - **averagePriceLast1H**: volume weighted average price for all trades happening within 1 hour before delivery start\n            \nFor a detailed breakdown on calculation rules, see <a href=\"https://developers.nordpoolgroup.com/reference/how-to-calculate-intraday-hourly-statistics\"> this page</a>.\n            \n[Sample response with valid data for year 2021](https://proddataservicespublic.blob.core.windows.net/public-api-response-samples/Intraday/get_api_v2_Intraday_HourlyStatistics_Yearly_Total.json)"
