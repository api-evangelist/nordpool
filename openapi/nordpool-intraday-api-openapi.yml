      - Intraday
      summary: Intraday Trades By Trade Time
      description: "Returns intraday contracts with trades, where trades have a trade time in between tradeTimeFrom - tradeTimeTo and at least one leg in the provided areas. \n\nAll trades have at least one leg belongs to Nord Pool. However, trades where both legs belong to other PXs are excluded from the response. \n\nData is available with a delay of approximately 20 minutes.\n            \n**Note**: The time difference between tradeTimeFrom and tradeTimeTo cannot exceed **12** hours.\nThis limitation was introduced for performance reasons to restrict the response size.\nDuring periods of high load on the system, responses may take longer than expected.\nIn such situations, it is recommended to query data in hourly intervals, for example\ntradeTimeFrom=2025-04-01T**01:00:00**Z and tradeTimeTo=2025-04-01T**02:00:00**Z.\n\n### Response field descriptions\n            \n**contracts**: a list of contracts to which these trades belong \n\nEach contract contains:\n- **contractId**: identifier of the contract\n- **contractName**: a descriptive name for the contract (e.g., QH-20250331-09).\n- **deliveryStart**: the timestamp when the contract delivery starts\n- **deliveryEnd**: the timestamp when the contract delivery ends\n- **trades**: a list of trades that have an updated time between updated time from and updated time to \n\n  Each trade includes:\n  - **tradeId**: identifier of the trade\n  - **tradeTime**: the timestamp of trade creation\n  - **tradeUpdatedAt**: the trade creation time (revisionNumber=1) or time of a trade modification (revisionNumber>1)\n  - **tradeState**:\n    - **Completed** - the trade is completed\n    - **Cancelled** - the trade is cancelled\n    - **Disputed** - the trade is pending decision for cancellation\n  - **revisionNumber**: revision number for trade modification request. Should be incremented with a subsequent trade modification request.\n  - **price**: price in EUR/MWh, GBP/MWh or ISK/MWh\n  - **volume**: quantity in MW\n  - **tradePhase**: there's two matching modes:\n    - **Continuous** - the normal top of order book matching\n    - **Auction** - the matching mode, where basically the buy and sell orders are matched in a similar manner as auction orders.\n      This only happens when capacity is added in between areas - basically, in that case, the order books can be\n      overlapping with buys in one area being much higher than sells in another area.\n      In order for the price to be fair for both the sellers and buyers, this auction matching mode is used.\n    - **None** - for old trades without this information\n  - **crossPx**:\n    - **false**: both legs belong to the Nord Pool market  \n    - **true**: one of the legs belongs to Other Power Exchanges (OPX). Then the trade contains \"referenceOrderId\" only for the side which is presented in Nord Pool, the other side doesn't have reference order id (\"referenceOrderId\": null).\n  - **legs**: a list of trade legs \n\n    Each leg contains: \n\n    - **deliveryArea**: delivery area that this order belongs to \n\n    - **referenceOrderId**: identifier of the order involved in the trade.\n      In transactions where one party is external to Nord Pool, the referenceOrderId will be null for the leg that belongs to OPX.\n    - **tradeSide**: Buy or Sell\n            \n[Sample response with valid data for areas NO1,AMP, trade time from 2025-05-05T00:30:00Z and trade time to 2025-05-05T01:54:00Z](https://proddataservicespublic.blob.core.windows.net/public-api-response-samples/Intraday/get_api_v2_Intraday_Trades_ByTradeTime.json)"
      parameters:
      - name: areas
        in: query
        description: 'Comma-separated list of areas (e.g., NO1, NO2).

          Supported: KT(legacy),NO1,NO2,NO3,NO4,NO5,SE1,SE2,SE3,SE4,FI,DK1,DK2,EE,LT,LV,AT,BE,FR,50Hz,AMP,TTG,TBW,NL,PL,TEL,BG,UK,IS'
        required: true
        schema:
          minItems: 1
          type: string
          items:
            type: string
      - name: tradeTimeFrom
        in: query
        description: Trade date and time starts, referring to a UTC datetime. Trades at or later this time will be included in the response. Format yyyy-MM-ddThh:mm:ssZ, for example 2024-08-15T01:00:00Z
        required: true
        schema:
          type: string
          format: date-time
      - name: tradeTimeTo
        in: query
        description: Trade date and time ends, referring to a UTC datetime. Trades earlier than this time will be included in the response. Format yyyy-MM-ddThh:mm:ssZ, for example 2024-08-15T01:15:00Z
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiIntradayContainer'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiIntradayContainer'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiIntradayContainer'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
