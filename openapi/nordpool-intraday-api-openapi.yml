        description: Delivery start time of the contract, referring to a UTC datetime. Format yyyy-MM-ddThh:mm:ssZ, for example 2024-08-15T01:00:00Z
        required: true
        schema:
          type: string
          format: date-time
      - name: contractId
        in: query
        description: The contract id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TopLevelPublicIntradayTradeContract'
            application/json:
              schema:
                $ref: '#/components/schemas/TopLevelPublicIntradayTradeContract'
            text/json:
              schema:
                $ref: '#/components/schemas/TopLevelPublicIntradayTradeContract'
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
      operationId: getApiV2IntradayTradesByContractId
      x-operation-id-source: derived
  /api/v2/Intraday/Trades/ByDeliveryStart:
    get:
      tags:
