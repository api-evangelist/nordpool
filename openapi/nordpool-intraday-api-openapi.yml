          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiDeliveryAreaYearlyHourlyStatistic'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDeliveryAreaYearlyHourlyStatistic'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiDeliveryAreaYearlyHourlyStatistic'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '403':
          description: Forbidden
