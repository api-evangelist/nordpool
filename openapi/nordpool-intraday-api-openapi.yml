  /api/v2/Intraday/Orders/ByContractId:
    get:
      tags:
      - Intraday
      summary: Intraday Orders By Contract
      description: "Returns intraday orders for the given contract which starts at the given time for a given area.\nData is available with a delay of approximately 20 minutes.\n \n### Response field descriptions\n\n- **contractId**: identifier of the contract\n- **contractName**: a descriptive name for the contract (e.g., QH-20250331-09).\n- **deliveryStart**: the timestamp when the contract delivery starts\n- **deliveryEnd**: the timestamp when the contract delivery ends\n- **orders**: a list of orders associated with the contract \n\n  Each order includes:\n  - **orderId**: identifier of the order\n  - **originalOrderId**: original order identifier in the modification chain\n  - **previousOrderId**: identifier of the previous order in the modification chain.\n    When an order is modified and its priority changes, or partially matched, a new order id is assigned\n  - **orderType**:\n    - **Limit** - an order that can be matched either in part or its entirety.\n    If a limit order is not fully matched it will remain active in the market until the product the order is placed on goes into expiry.\n    - **Iceberg** -  a type of limit order, usually with a large volume, with the purpose of hiding the full size\n    of the order by dividing it into smaller clips. The first clip is shown to the market and the next clips will\n    be visible when the previous ones have been fully matched. New clips receive a new time stamp.\n    - **UserDefinedBlock** - a block order consisting of one or several (up to 24) consecutive hourly products.\n    User-defined block orders are all-or-nothing orders where only the entire volume may be executed.\n  - **side**: Buy or Sell\n  - **createdTime**: the timestamp of order creation. Iceberg orders get updated \"created time\" when a new slice is added,\n    but retain the order id. For other order types, they get a new order id and a new \"created time\".\n  - **revisions**: a list of order revisions \n\n    Each revision contains:\n    - **revisionNumber**: revision number for order modification request. Should be incremented with a subsequent order modification request.\n      The initial value to issue an order modification is set to 1 (USER_ADDED status).\n      Please note that order modification with a priority change leads to a new order created (revisionNumber = 1). \n\n    - **updatedTime**: the order entry time (revision=1) or time an order modification (revision>1)\n    - **price**: price in EUR/MWh, GBP/MWh or ISK/MWh\n    - **volume**: quantity in MW\n    - **state**:\n      - **Active** - an order can be matched either in part or in entirety. If the order is not fully\n      matched it will remain \"active\" in the market.\n      - **Inactive** - if the order is fully matched or closed (the product the order is placed on goes into expiry)\n      then the status will be \"inactive\". The inactive order will never be reopened.\n      - **Hibernated** - if the order is deactivated by the user then the order will be placed as \"hibernate\" and can be reopened\n      - **Pending** - pending status is acknowledgment that order received by exchange\n    - **action**:\n      - **UserAdded** - order added by a user\n      - **UserHibernated** - order deactivated by a user\n      - **UserModified** - order modified by a user\n      - **UserDeleted** - order deleted by a user\n      - **SystemHibernated** - order deactivated by the system\n      - **SystemModified** - order modified by the system\n      - **SystemDeleted** - order deleted by the system\n      - **PartialExecution** - order is partially executed\n      - **FullExecution** - order is fully executed\n      - **IcebergSliceAdded** - a new slice of an Iceberg order was added to the service\n    - **expirationTime**: if timeInForce is set to GTD (Good Till Date), the expireTime will determine when the order expires.\n      Accepted value is multiple of 5 minutes, i.e. not 2018-06-21T07:32:52.673Z but either 2018-06-21T07:30:00.000Z or 2018-06-21T07:35:00.000Z.\n    - **timeInForce**:\n      - **FillOrKill** - the order is immediately fully executed or deleted\n      - **ImmediateOrCancel** - the order is executed immediately to its maximum extent. \n      In a case of a partial execution, the remaining volume is removed from the order book.\n      - **GoodForSession** - the order rests in the order book until it is either executed,\n        removed by the user or the current trading session (trading phase) of the underlying contract ends\n      - **GoodTillDate** - the order rests in the order book until the date specified in the expireTime field\n    - **icebergClipSize**: the quantity in MW for when to trigger a new slice (for iceberg orders only, described above)\n    - **clipPriceChange**: the price change after each clip is consumed (for iceberg orders only, described above)\n    - **remainingVolume**: the remaining volume in MW for the whole iceberg order\n            \n[Sample response with valid data for area NO1, delivery start 2025-05-05T01:00:00Z and contract id NX_519789](https://proddataservicespublic.blob.core.windows.net/public-api-response-samples/Intraday/get_api_v2_Intraday_Orders_ByContractId.json)"
      parameters:
      - name: area
        in: query
        description: 'Delivery area (e.g., NO1).

          Supported: KT(legacy),NO1,NO2,NO3,NO4,NO5,SE1,SE2,SE3,SE4,FI,DK1,DK2,EE,LT,LV,AT,BE,FR,50Hz,AMP,TTG,TBW,NL,PL,TEL,BG,UK,IS'
        required: true
        schema:
          minLength: 1
          type: string
      - name: deliveryStart
        in: query
        description: Delivery start time of the contract, referring to a UTC datetime. Format yyyy-MM-ddThh:mm:ssZ, for example 2024-08-15T01:00:00Z
        required: true
        schema:
          type: string
          format: date-time
      - name: contractId
        in: query
        description: The contract id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TopLevelPublicIntradayOrderContract'
            application/json:
              schema:
                $ref: '#/components/schemas/TopLevelPublicIntradayOrderContract'
            text/json:
              schema:
                $ref: '#/components/schemas/TopLevelPublicIntradayOrderContract'
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
