the market and the next clips will\n    be visible when the previous ones have been fully matched. New clips receive a new time stamp.\n    - **UserDefinedBlock** - a block order consisting of one or several (up to 24) consecutive hourly products.\n    User-defined block orders are all-or-nothing orders where only the entire volume may be executed.\n  - **side**: Buy or Sell\n  - **createdTime**: the timestamp of order creation. Iceberg orders get updated \"created time\" when a new slice is added,\n    but retain the order id. For other order types, they get a new order id and a new \"created time\".\n  - **revisions**: a list of order revisions \n\n    Each revision contains:\n    - **revisionNumber**: revision number for order modification request. Should be incremented with a subsequent order modification request.\n      The initial value to issue an order modification is set to 1 (USER_ADDED status).\n      Please note that order modification with a priority change leads to a new order created (revisionNumber = 1). \n\n    - **updatedTime**: the order entry time (revision=1) or time an order modification (revision>1)\n    - **price**: price in EUR/MWh, GBP/MWh or ISK/MWh\n    - **volume**: quantity in MW\n    - **state**:\n      - **Active** - an order can be matched either in part or in entirety. If the order is not fully\n      matched it will remain \"active\" in the market.\n      - **Inactive** - if the order is fully matched or closed (the product the order is placed on goes into expiry)\n      then the status will be \"inactive\". The inactive order will never be reopened.\n      - **Hibernated** - if the order is deactivated by the user then the order will be placed as \"hibernate\" and can be reopened\n      - **Pending** - pending status is acknowledgment that order received by exchange\n    - **action**:\n      - **UserAdded** - order added by a user\n      - **UserHibernated** - order deactivated by a user\n      - **UserModified** - order modified by a user\n      - **UserDeleted** - order deleted by a user\n      - **SystemHibernated** - order deactivated by the system\n      - **SystemModified** - order modified by the system\n      - **SystemDeleted** - order deleted by the system\n      - **PartialExecution** - order is partially executed\n      - **FullExecution** - order is fully executed\n      - **IcebergSliceAdded** - a new slice of an Iceberg order was added to the service\n    - **expirationTime**: if timeInForce is set to GTD (Good Till Date), the expireTime will determine when the order expires.\n      Accepted value is multiple of 5 minutes, i.e. not 2018-06-21T07:32:52.673Z but either 2018-06-21T07:30:00.000Z or 2018-06-21T07:35:00.000Z.\n    - **timeInForce**:\n      - **FillOrKill** - the order is immediately fully executed or deleted\n      - **ImmediateOrCancel** - the order is executed immediately to its maximum extent. \n      In a case of a partial execution, the remaining volume is removed from the order book.\n      - **GoodForSession** - the order rests in the order book until it is either executed,\n        removed by the user or the current trading session (trading phase) of the underlying contract ends\n      - **GoodTillDate** - the order rests in the order book until the date specified in the expireTime field\n    - **icebergClipSize**: the quantity in MW for when to trigger a new slice (for iceberg orders only, described above)\n    - **clipPriceChange**: the price change after each clip is consumed (for iceberg orders only, described above)\n    - **remainingVolume**: the remaining volume in MW for the whole iceberg order\n\n[Sample response with valid data for area NO1, delivery start from 2025-05-05T01:00:00Z and delivery start to 2025-05-05T02:00:00Z](https://proddataservicespublic.blob.core.windows.net/public-api-response-samples/Intraday/get_api_v2_Intraday_Orders_ByDeliveryStart.json)"
