      properties:
        deliveryStart:
          type: string
          format: date-time
        deliveryEnd:
          type: string
          format: date-time
        price:
          type:
          - number
          - 'null'
          format: double
      additionalProperties: false
    SystemVolumeMonthlySummary:
      type: object
      properties:
        totalTurnover:
          type: number
          format: double
        averageTurnover:
          type: number
          format: double
        minTurnover:
          type: number
          format: double
        maxTurnover:
          type: number
          format: double
        deliveryDateStartCET:
          type: string
          format: date
        deliveryDateEndCET:
          type: string
          format: date
      additionalProperties: false
    ValidationProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
        errors:
          type:
          - object
          - 'null'
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: {}
    ApiSystemTurnover:
      type: object
      properties:
        deliveryDateCET:
          type: string
          format: date
        updatedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ApiAuctionStatus'
        unit:
          type:
          - string
          - 'null'
          readOnly: true
        totalTurnoverUnit:
          type:
          - string
          - 'null'
          readOnly: true
        totalTurnover:
          type:
          - number
          - 'null'
          format: double
        averageTurnover:
          type:
          - number
          - 'null'
          format: double
        minTurnover:
          type:
          - number
          - 'null'
          format: double
        maxTurnover:
          type:
          - number
          - 'null'
          format: double
        blockVolumesUnit:
          type:
          - string
          - 'null'
          readOnly: true
        blockVolumes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SystemVolumeBlockAggregate'
        volumes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SystemVolumeEntry'
      additionalProperties: false
  securitySchemes:
