          type: string
          items:
            type: string
      - name: date
        in: query
        description: Delivery date, referring to CET date. Format yyyy-MM-dd, for example 2024-08-15
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiAuctionVolume'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiAuctionVolume'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiAuctionVolume'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
  /api/v2/Auction/Volumes/Yearly/ByArea:
    get:
      tags:
      - Auction
      summary: Yearly Auction Volumes
      description: "Returns a list of auction volumes for a market, year and one area.\n            \nNote that this volume only reflect Nord Pool's part of the traded volume, not the market total volume.\n            \n            \n### Response field descriptions\n**yearlySummary**: \n - **totalVolume**: contains total bought and sold MWh for the year\n - **averageVolume**: the average bought and sold MW across all delivery periods\n - **minVolume**: the minimum bought and sold MW across all delivery periods\n - **maxVolume**: the maximum bought and sold MW across all delivery periods\n            \n**monthlySummary**: a list of monthly aggregate values\n - **totalVolume**: contains total bought and sold MWh for the month\n - **averageVolume**: the average bought and sold MW across all delivery periods in the month\n - **minVolume**: the minimum bought and sold MW across all delivery periods in the month\n - **maxVolume**: the maximum bought and sold MW across all delivery periods in the month\n            \n**dailySummary**: a list of daily aggregate values\n - **totalVolume**: contains total bought and sold MWh for the day\n - **averageVolume**: the average bought and sold MW across all delivery periods in the day\n - **minVolume**: the minimum bought and sold MW across all delivery periods in the day\n - **maxVolume**: the maximum bought and sold MW across all delivery periods in the day\n\n**blockVolumes**: a list of MWh buy and sell volumes for a period of the day.\n            \n**volumes**: a list of MW buy and sell volumes per delivery period\n\nOnly final volumes are included in this endpoint."
      parameters:
      - name: market
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/AuctionMarkets'
      - name: area
        in: query
        description: 'One area. For example NO1.

          Supported: NO1,NO2,NO3,NO4,NO5,SE1,SE2,SE3,SE4,FI,DK1,DK2,EE,LT,LV,AT,BE,FR,GER,50Hz,AMP,TTG,TBW,NL,PL,UK,TEL,BG'
        required: true
        schema:
          minLength: 1
          type: string
      - name: year
        in: query
        description: 'Year in CET (format: yyyy, e.g., 2024)'
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiAuctionYearlyVolume'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAuctionYearlyVolume'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiAuctionYearlyVolume'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
