  /api/v2/PowerSystem/Productions/Yearly/ByLocation:
    get:
      tags:
      - PowerSystem
      summary: Yearly Production By Location
      description: "Returns a list of productions for a year and one location.\n            \nProduction tells how much electricity is being produced in an area and delivery period for each production type. Production by location aggregates delivery area production value into country or region values. \n            \n### Response field descriptions\n- **status**: Missing if no data found for the date and area. Available if data is present\n- **locationType**: Country or Region\n- **deliveryAreas**: delivery areas used for this locational aggregation\n- **yearlySummary**: yearly total aggregated production\n  - **byType**: a dictionary of production types, where each key corresponds to a production type and each value to production volume for that type, in MWh.\n  - **total**: the total production volume, in MWh\n- **monthlySummaries**: a list of aggregated production values per month\n  - **byType**: a dictionary of production types, where each key corresponds to a production type and each value to production volume for that type, in MWh.\n  - **total**: the total production volume, in MWh\n- **dailySummaries**: a list of aggregated production values per day\n  - **byType**: a dictionary of production types, where each key corresponds to a production type and each value to production volume for that type, in MWh.\n  - **total**: the total production volume, in MWh\n- **productions**: a list of delivery periods\n  - **deliveryStart**: start of delivery period\n  - **deliveryEnd**: end of delivery period\n  - **byType**: a dictionary of production types, where each key corresponds to a production type and each value to production volume for that type, in MW.\n  - **total**: a sum of all production values for this delivery period, in MW\n            \n[Sample response with valid data for location NO and year 2021](https://proddataservicespublic.blob.core.windows.net/public-api-response-samples/PowerSystem/get_api_v2_PowerSystem_Productions_Yearly_ByLocation.json)"
      parameters:
      - name: location
        in: query
        description: 'One location. For example NO.

          Supported: AT, BE, DE, LU, DK, EE, FI, FR, LT, LV, NL, NO, PL, SE, RO, BG, BALTIC, CWE, DE-LU, NORDIC'
        required: true
        schema:
          minLength: 1
          type: string
      - name: year
        in: query
        description: 'Year in CET (format: yyyy, e.g., 2024)'
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiYearlyProductionByLocation'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiYearlyProductionByLocation'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiYearlyProductionByLocation'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
