meters:
- name: region_data_packages
  description: Annual data fee per subscribed region/scope package (day-ahead, intraday, operating, regulating, bidding curves).
  unit: subscriptions
  aggregation: sum
  dimensions:
  - region
  - dataScope
- name: api_accounts
  description: OAuth API accounts beyond the one included per customer, at EUR 350 per year each.
  unit: accounts
  aggregation: sum
  dimensions:
  - team
- name: redistribution_licenses
  description: Licenses required when Nord Pool data is redistributed to third parties, from EUR 3,500 to 5,500 per year.
  unit: licenses
  aggregation: sum
  dimensions:
  - useCase
- name: data_portal_seats
  description: Data Portal web subscription tier (SOLO through ENTERPRISE PRO) by seat count.
  unit: seats
  aggregation: max
  dimensions:
  - tier
principles:
- name: Visibility
  description: Inventory which region packages, API accounts, and Data Portal seats are active and which teams consume each data feed.
- name: Allocation
  description: Map each region package and additional API account to the trading, analytics, or retail team that requested it.
- name: Optimization
  description: Subscribe only to regions actually traded or analyzed; use price-only packages where volumes and flows are not needed; consider the free public endpoint for non-contractual day-ahead price display.
- name: Accountability
  description: Review the annual renewal against actual usage of each feed before the calendar-year billing cycle; fees are committed for the year once purchased.
