description: >-
  FinOps view of Nord Pool spend. Unlike usage-metered API vendors, Nord Pool
  charges flat annual data fees per region package for Market Data API access
  (published day-ahead packages roughly EUR 1,250 to 4,100 per year, price-only
  packages EUR 1,200 to 3,300 per year, bidding curves EUR 430 to 1,650 per
  year), plus EUR 350 per year per additional API account and redistribution
  licenses from EUR 3,500 to 5,500 per year where data is passed on to third
  parties. The Data Portal web platform is a separate seat-tiered annual
  subscription (EUR 1,200 to 9,000). Trading APIs carry no API fee for members
  - their cost center is trading membership, clearing, and settlement. Costs
  are therefore driven by which regions, data scopes, and seats you subscribe
  to, not by request volume.
notes: >-
  All fees per calendar year, excluding VAT, as published 2026-07-11. The main
  optimization levers are subscribing only to needed region packages, sharing
  the single included API account, avoiding redistribution-triggering use, and
  using the free (unofficial, no-SLA) public Data Portal endpoint for simple
  published day-ahead price lookups where contractual data quality is not
  required. Special terms exist for trading members, students, researchers,
  and academics.
